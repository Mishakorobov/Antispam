# Nginx Reverse Proxy Configuration for AntiSpam Backend
# Place in /etc/nginx/sites-available/antispam and link to sites-enabled

upstream antispam_upstream {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.antispam.yourdomain.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.antispam.yourdomain.com;

    # SSL Configuration (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.antispam.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.antispam.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip Compression for JSON & Text
    gzip on;
    gzip_types application/json text/plain application/octet-stream;
    gzip_min_length 1024;

    # Maximum request body size for batch complaints
    client_max_body_size 10M;

    location / {
        proxy_pass http://antispam_upstream;
        proxy_http_version 1.1;

        # WebSocket / Connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Real IP Forwarding (Critical for Subnet Rate Limiting)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for streaming sync
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
