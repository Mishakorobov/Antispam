name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release / debug)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding production keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/antispam-release.jks
          elif [ ! -f "android/antispam-release.jks" ]; then
            echo "Generating release keystore on runner..."
            keytool -genkeypair -v -keystore android/antispam-release.jks -alias antispam -keyalg RSA -keysize 2048 -validity 10000 -storepass antispam2026secure -keypass antispam2026secure -dname "CN=AntiSpam, OU=Security, O=AntiSpam, L=Moscow, ST=Moscow, C=RU"
          fi

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antispam-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: 'AntiSpam Shield: Блокировка спама и защита от прослушки Release ${{ github.ref_name }}'
          body: |
            Release ${{ github.ref_name }} of AntiSpam Shield: Блокировка спама и защита от прослушки Android Application.
            - High-performance on-device call screening (< 1 ms)
            - Privacy Shield with Microphone Jammer (MicGuard)
            - Dual-circuit registry sync with CDN fallback & P2P offline sharing
            - Zero-Telemetry Telecom & Privacy Firewall
          files: |
            android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
